<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Maritime Security Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: radial-gradient(ellipse at top, #0f1c30, #050b16 70%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: linear-gradient(135deg, rgba(30,41,59,.95), rgba(15,23,42,.95));
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #0ea5e9, #06b6d4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .logo-text h1 {
            font-size: 18px;
            color: #f1f5f9;
            margin-bottom: 2px;
        }

        .logo-text p {
            font-size: 12px;
            color: #06b6d4;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #f1f5f9;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0ea5e9;
            background: rgba(15, 23, 42, 0.8);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            color: #64748b;
            transition: color 0.2s;
        }

        .toggle-password:hover svg {
            color: #0ea5e9;
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: #334155;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }

        .password-strength.show {
            display: block;
        }

        .password-strength-bar {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s, background-color 0.3s;
            width: 0%;
        }

        .password-strength-bar.weak {
            width: 33%;
            background: #ef4444;
        }

        .password-strength-bar.medium {
            width: 66%;
            background: #f59e0b;
        }

        .password-strength-bar.strong {
            width: 100%;
            background: #22c55e;
        }

        .password-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
            line-height: 1.4;
        }

        .error-message {
            font-size: 12px;
            color: #ef4444;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #06b6d4);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 6px 16px rgba(14, 165, 233, 0.4);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .success-message.show {
            display: flex;
        }

        .success-message svg {
            width: 24px;
            height: 24px;
            color: #22c55e;
            flex-shrink: 0;
        }

        .success-message-text h3 {
            font-size: 14px;
            color: #22c55e;
            margin-bottom: 4px;
        }

        .success-message-text p {
            font-size: 12px;
            color: #94a3b8;
        }

        .requirements {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .requirements h4 {
            font-size: 13px;
            color: #f1f5f9;
            margin-bottom: 12px;
        }

        .requirement-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .requirement-item:last-child {
            margin-bottom: 0;
        }

        .requirement-item svg {
            width: 16px;
            height: 16px;
            color: #64748b;
            flex-shrink: 0;
        }

        .requirement-item.valid svg {
            color: #22c55e;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #0ea5e9;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #06b6d4;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <h2>Reset Your Password</h2>
            <p>Enter your new password below</p>
        </div>

        <!-- Success Message -->
        <div class="success-message" id="successMessage">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <div class="success-message-text">
                <h3>Password Reset Successfully!</h3>
                <p>Redirecting to login page...</p>
            </div>
        </div>

        <!-- Form -->
        <form id="resetForm">
            <!-- New Password -->
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="newPassword" 
                        placeholder="Enter new password"
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">
                        <svg id="eye-newPassword" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="password-strength" id="passwordStrength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="error-message" id="newPasswordError"></div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        placeholder="Confirm new password"
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                        <svg id="eye-confirmPassword" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary" id="submitBtn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Reset Password
            </button>
        </form>

        <!-- Back to Login -->
        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        var newPasswordInput = document.getElementById('newPassword');
        var confirmPasswordInput = document.getElementById('confirmPassword');
        var resetForm = document.getElementById('resetForm');
        var submitBtn = document.getElementById('submitBtn');
        var passwordStrength = document.getElementById('passwordStrength');
        var strengthBar = document.getElementById('strengthBar');
        var successMessage = document.getElementById('successMessage');

        // Password strength checker
        function checkPasswordStrength(password) {
            var strength = 0;
            var checks = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
            };

            // Calculate strength
            for (var key in checks) {
                if (checks[key]) strength++;
            }

            return { strength: strength, checks: checks };
        }

        function updateStrengthBar(strength) {
            passwordStrength.classList.add('show');
            strengthBar.className = 'password-strength-bar';
            
            if (strength <= 2) {
                strengthBar.classList.add('weak');
            } else if (strength <= 4) {
                strengthBar.classList.add('medium');
            } else {
                strengthBar.classList.add('strong');
            }
        }

        // Toggle password visibility
        function togglePassword(fieldId) {
            var input = document.getElementById(fieldId);
            var eyeIcon = document.getElementById('eye-' + fieldId);
            
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
            } else {
                input.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
            }
        }

        // Real-time password validation
        newPasswordInput.addEventListener('input', function() {
            var password = this.value;
            var result = checkPasswordStrength(password);
            
            if (password.length > 0) {
                updateStrengthBar(result.strength);
            } else {
                passwordStrength.classList.remove('show');
            }

            // Clear error if typing
            document.getElementById('newPasswordError').classList.remove('show');
        });

        confirmPasswordInput.addEventListener('input', function() {
            document.getElementById('confirmPasswordError').classList.remove('show');
        });

        // Form submission
        resetForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            var newPassword = newPasswordInput.value;
            var confirmPassword = confirmPasswordInput.value;
            var isValid = true;

            // Clear previous errors
            document.getElementById('newPasswordError').classList.remove('show');
            document.getElementById('confirmPasswordError').classList.remove('show');

            // Validate new password
            var result = checkPasswordStrength(newPassword);
            var allChecksPassed = Object.values(result.checks).every(function(check) { return check; });
            
            if (!allChecksPassed) {
                document.getElementById('newPasswordError').textContent = 'Password does not meet all requirements';
                document.getElementById('newPasswordError').classList.add('show');
                newPasswordInput.parentElement.parentElement.classList.add('shake');
                setTimeout(function() {
                    newPasswordInput.parentElement.parentElement.classList.remove('shake');
                }, 300);
                isValid = false;
            }

            // Validate password match
            if (newPassword !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
                document.getElementById('confirmPasswordError').classList.add('show');
                confirmPasswordInput.parentElement.parentElement.classList.add('shake');
                setTimeout(function() {
                    confirmPasswordInput.parentElement.parentElement.classList.remove('shake');
                }, 300);
                isValid = false;
            }

            if (isValid) {
                // Disable button and show loading state
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<svg style="animation: spin 1s linear infinite;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Resetting...';

                // Simulate API call
                setTimeout(function() {
                    // Show success message
                    successMessage.classList.add('show');
                    resetForm.style.display = 'none';

                    // Redirect after 2 seconds
                    setTimeout(function() {
                        // window.location.href = 'login.html';
                        alert('Password reset successful! Redirecting to login...');
                    }, 2000);
                }, 1500);
            }
        });

        // Add spin animation
        var style = document.createElement('style');
        style.textContent = '@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }';
        document.head.appendChild(style);
    </script>
</body>
</html>
