<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanTech Underwater Maritime Security - Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a192f 0%, #112240 50%, #0a192f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.02" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,112C672,96,768,96,864,112C960,128,1056,160,1152,160C1248,160,1344,128,1392,112L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-repeat: no-repeat;
            background-position: bottom;
            opacity: 0.3;
        }

        .container {
            background: #1a2332;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            position: relative;
            z-index: 1;
            animation: slideIn 0.5s ease-out;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .branding {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(100, 255, 218, 0.2);
        }

        h1 {
            color: #64ffda;
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            color: #8892b0;
            font-size: 14px;
        }

        .verification-info {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(100, 255, 218, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(100, 255, 218, 0.1);
        }

        .verification-info h2 {
            color: #64ffda;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .verification-info p {
            color: #8892b0;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccd6f6;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(100, 255, 218, 0.2);
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #0a192f;
            color: #ccd6f6;
        }

        input:focus {
            outline: none;
            border-color: #64ffda;
            box-shadow: 0 0 0 4px rgba(100, 255, 218, 0.1);
        }

        .verification-input {
            text-align: center;
            font-size: 24px;
            letter-spacing: 10px;
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #64ffda, #5eead4);
            color: #0a192f;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(100, 255, 218, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(100, 255, 218, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .resend-code {
            text-align: center;
            margin-top: 15px;
            color: #64ffda;
            cursor: pointer;
            font-size: 14px;
        }

        .resend-code:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .success-message {
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            border: 1px solid rgba(100, 255, 218, 0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(100, 255, 218, 0.1);
            color: #8892b0;
            font-size: 14px;
        }

        .back-link a {
            color: #64ffda;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #0a192f;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn.loading .btn-text {
            display: none;
        }

        .btn.loading .loading-spinner {
            display: block;
        }

        ::placeholder {
            color: #8892b0;
            opacity: 0.6;
        }

        .countdown {
            text-align: center;
            color: #8892b0;
            font-size: 13px;
            margin-top: 10px;
        }

        .countdown.active {
            color: #64ffda;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="branding">
            <h1>Two-Factor Authentication</h1>
            <p class="subtitle">Verify Your Identity</p>
        </div>

        <div class="verification-info">
            <h2>📧 Verification Code Sent</h2>
            <p>We've sent a 6-digit verification code to your registered email address and phone number. Please enter it below to complete your login.</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="verification-form">
            <div class="form-group">
                <label for="verification-code">Enter 6-Digit Code</label>
                <input type="text" id="verification-code" class="verification-input" maxlength="6" placeholder="000000" required>
                <div class="countdown" id="countdown"></div>
            </div>

            <button type="submit" class="btn" id="verify-btn">
                <span class="btn-text">Verify & Access Dashboard</span>
                <div class="loading-spinner"></div>
            </button>

            <div class="resend-code" id="resend-code" onclick="resendCode()">
                Didn't receive code? Resend
            </div>
        </form>

        <div class="back-link">
            <a href="#" onclick="backToLogin()">← Back to Login</a>
        </div>
    </div>

    <script>
        let resendTimer;
        let resendCountdown = 60;

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }

        // Verification code input handling
        document.getElementById('verification-code').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Start resend countdown
        function startResendCountdown() {
            resendCountdown = 60;
            const resendBtn = document.getElementById('resend-code');
            const countdownDiv = document.getElementById('countdown');
            
            resendBtn.style.opacity = '0.5';
            resendBtn.style.pointerEvents = 'none';
            countdownDiv.classList.add('active');
            
            resendTimer = setInterval(() => {
                resendCountdown--;
                countdownDiv.textContent = `Resend available in ${resendCountdown}s`;
                
                if (resendCountdown <= 0) {
                    clearInterval(resendTimer);
                    resendBtn.style.opacity = '1';
                    resendBtn.style.pointerEvents = 'auto';
                    countdownDiv.textContent = '';
                    countdownDiv.classList.remove('active');
                }
            }, 1000);
        }

        // Resend code function
        function resendCode() {
            showSuccess('New verification code sent to your registered contact.');
            startResendCountdown();
            console.log('New Demo Verification Code: 123456');
        }

        // Back to login
        function backToLogin() {
            window.location.href = 'login.html';
            alert('Returning to login page...');
        }

        // Verification form submission
        document.getElementById('verification-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const code = document.getElementById('verification-code').value;
            const verifyBtn = document.getElementById('verify-btn');

            if (code.length !== 6) {
                showError('Please enter a valid 6-digit verification code');
                return;
            }

            verifyBtn.classList.add('loading');
            verifyBtn.disabled = true;

            setTimeout(() => {
                verifyBtn.classList.remove('loading');
                verifyBtn.disabled = false;

                // Simulate successful verification
                if (code === '123456') {
                    showSuccess('Authentication successful! Redirecting to dashboard...');
                    
                    setTimeout(() => {
                        alert('Login Successful!\n\nYou will now be redirected to the Underwater Maritime Security Dashboard.');
                        // Redirect to dashboard
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showError('Invalid verification code. Please try again.');
                }
            }, 2000);
        });

        // Start countdown on page load
        startResendCountdown();

        // Demo verification code
        console.log('Demo Verification Code: 123456');
    </script>
</body>
</html>
