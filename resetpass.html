<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #011137 0%, #1e293b 50%, #020816 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: #1e293b;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(71, 85, 105, 0.3);
            max-width: 400px;
            width: 100%;
        }

        .section-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .icon-badge {
            width: 64px;
            height: 64px;
            background: rgba(37, 99, 235, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .icon-badge svg {
            width: 32px;
            height: 32px;
            color: #2563eb;
        }

        .section-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .section-header p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            width: 20px;
            height: 20px;
        }

        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            background: #0f172a;
            color: #f1f5f9;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        input::placeholder {
            color: #64748b;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #334155;
            color: #f1f5f9;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .text-center {
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .success-box {
            text-align: center;
        }

        .success-box .icon-badge {
            background: rgba(16, 185, 129, 0.2);
        }

        .success-box .icon-badge svg {
            color: #10b981;
        }

        .success-box h3 {
            color: #10b981;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .success-box p {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .link-text {
            color: #60a5fa;
            font-size: 14px;
            cursor: pointer;
            margin-top: 16px;
            display: inline-block;
        }

        .link-text:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Reset Password Form -->
        <div id="forgotPasswordForm">
            <div class="section-header">
                <div class="icon-badge">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                    </svg>
                </div>
                <h2>Reset Password</h2>
                <p>Enter your email address and we'll send you a reset link</p>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <input type="email" id="email" placeholder="your.email@example.com">
                </div>
            </div>

            <button class="btn btn-primary" onclick="handlePasswordReset()">Send Reset Link</button>
            <button class="btn btn-secondary" onclick="backToLogin()">Back to Login</button>
        </div>

        <!-- Success Message -->
        <div id="successMessage" class="hidden">
            <div class="success-box">
                <div class="icon-badge">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <h3>Email Sent!</h3>
                <p>We've sent password reset instructions to your email address.</p>
                <p>Please check your inbox and follow the link to reset your password.</p>
            </div>
            
            <button class="btn btn-primary" onclick="backToLogin()">Back to Login</button>

            <div class="text-center">
                <span class="link-text" onclick="showForgotForm()">Resend email</span>
            </div>
        </div>
    </div>

    <script>
        function handlePasswordReset() {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                alert('Please enter your email address');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address');
                return;
            }

            document.getElementById('forgotPasswordForm').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
        }

        function backToLogin() {
            alert('Redirecting to login page...');
            window.location.href = 'login.html';
        }

        function showForgotForm() {
            document.getElementById('successMessage').classList.add('hidden');
            document.getElementById('forgotPasswordForm').classList.remove('hidden');
            document.getElementById('email').value = '';
        }
    </script>
</body>
</html>
